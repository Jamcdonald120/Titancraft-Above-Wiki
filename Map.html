<script>
  // Wrap map initialization to avoid scope collisions inside Wiki.js
  (function initWikiMap() {
    // If Leaflet isn't loaded yet, delay initialization
    if (typeof L === 'undefined') {
      setTimeout(initWikiMap, 100);
      return;
    }

    const imgWidth = 3200;
    const imgHeight = 3200;
    const imageBounds = [[0, 0], [imgHeight, imgWidth]];

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 2,
      zoomSnap: 0.5
    });

    // NOTE: Path relative to Wiki.js static asset folder or root upload path
    L.imageOverlay('/the_above_map.png', imageBounds).addTo(map);
    map.fitBounds(imageBounds);

    const defaultIcon = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],   
      popupAnchor: [1, -34]
    });

    const allMarkersLayer = L.layerGroup().addTo(map);
    const categoryLayers = {};

    // NOTE: Path relative to Wiki.js static asset folder or public root
    fetch('/minecraft_markers.json')
      .then(res => {
        if (!res.ok) throw new Error('Failed to load marker data');
        return res.json();
      })
      .then(markers => {
        markers.forEach(poi => {
          const leafletY = imgHeight - poi.y;
          const leafletX = poi.x;
          const category = poi.group || "General";

          if (!categoryLayers[category]) {
            categoryLayers[category] = L.layerGroup().addTo(map);
          }

          const eventTypeHTML = poi.event_type ? `<p><b>Type:</b> ${poi.event_type}</p>` : '';
          const playersHTML = poi.players ? `<p><b>Players:</b> ${poi.players}</p>` : '';

          const marker = L.marker([leafletY, leafletX], { 
            icon: defaultIcon,
            title: poi.name
          }).bindPopup(`
            <div class="poi-popup">
              <h3>${poi.name}</h3>
              <p><b>Group:</b> ${category}</p>
              ${eventTypeHTML}
              ${playersHTML}
            </div>
          `);

          marker.addTo(categoryLayers[category]);
          marker.addTo(allMarkersLayer);
        });

        L.control.layers(null, categoryLayers, { collapsed: false }).addTo(map);

        const searchControl = new L.Control.Search({
          layer: allMarkersLayer,
          propertyName: 'title',
          initial: false,
          zoom: 1,
          marker: false,
          moveToLocation: function(latlng, title, map) {
            map.setView(latlng, 1);
            allMarkersLayer.eachLayer(function(marker) {
              if (marker.options.title === title) {
                marker.openPopup();
              }
            });
          }
        });

        map.addControl(searchControl);
      })
      .catch(err => console.error("Wiki.js Map Error:", err));
  })();
</script>
